[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prosze"
version = "0.1.0"
description = "Remove sensitive details from prompts before they reach an AI."
readme = "README-NER.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "prompt_toolkit>=3.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
ner = ["gliner>=0.2.0"]

[project.scripts]
prosze = "prosze_cli:main"

[tool.setuptools]
py-modules = ["prosze_proxy", "tui", "hermes_connector", "prosze_main"]

[tool.setuptools.packages.find]
include = ["prosze_cli*"]
