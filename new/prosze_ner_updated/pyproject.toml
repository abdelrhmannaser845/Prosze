[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prosze"
version = "1.0.0"
description = "Zero-leak local privacy shield for Hermes Agent and CLI."
readme = "README-NER.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ner = ["gliner>=0.2.0"]

[project.scripts]
prosze = "prosze_cli:main"

[tool.setuptools]
py-modules = ["prosze_core", "prosze_main"]

[tool.setuptools.packages.find]
include = ["prosze_cli*"]
